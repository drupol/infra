[package]
edition = "2024"
name    = "temper"
version = "0.1.0"
[dependencies]
anyhow     = "1.0"
byteorder  = "1.4"
clap       = { version = "4.4", features = ["derive"] }
hex        = "0.4"
nix        = { version = "0.27", features = ["fs", "poll"] }
regex      = "1.10"
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serialport = { version = "4.2", default-features = false }
